<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LigaMaster</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        ⚽ LigaMaster
    </h1>

    <div class="d-flex justify-content-end mb-3">
        <a href="/crear" class="btn btn-success">
            Agregar Equipo
        </a>
    </div>

    <table class="table table-dark table-striped table-hover">

        <thead>

            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Ciudad</th>
                <th>Entrenador</th>
                <th>Estadio</th>
                <th>Títulos</th>
                <th>Acciones</th>
            </tr>

        </thead>

        <tbody>

        {% for e in equipos %}

            <tr>

                <td>{{ e.id }}</td>
                <td>{{ e.nombre }}</td>
                <td>{{ e.ciudad }}</td>
                <td>{{ e.entrenador }}</td>
                <td>{{ e.estadio }}</td>
                <td>{{ e.titulos }}</td>

                <td>

                    <a href="/editar/{{ e.id }}" class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <a href="/eliminar/{{ e.id }}" class="btn btn-danger btn-sm">
                        Eliminar
                    </a>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
